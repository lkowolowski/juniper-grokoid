[project]
name = "juniper-grokoid"
version = "0.1.0"
description = "Junos Syslog -> Graylog Grok Extractor Generator"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "E", "W", "N"]

[dependency-groups]
test = ["pytest>=7.0.0", "openpyxl>=3.0.0"]
